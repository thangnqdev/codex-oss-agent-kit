name: Codex PR Review & AGENTS.md Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Run Codex Pull Request Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          if [ -n "${OPENAI_API_KEY}" ]; then
            node bin/codex-oss.js review --diff pr.diff --agents AGENTS.md
          else
            echo "OPENAI_API_KEY is not set; running mock review as a local quality gate."
            node bin/codex-oss.js --mock review --diff pr.diff --agents AGENTS.md
          fi

name: Codex Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Static Security Audit
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'src/*.ts' 'src/**/*.ts')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No source files to audit"
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            echo "Auditing ${f}"
            node bin/codex-oss.js audit --file "$f" || status=1
          done
          exit "$status"
